<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">

    <title>Doctor Dashboard | ClinicBook</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style (1).css">
</head>

<body>

    <nav class="navbar shadow-sm">
        <div class="container">
            <a href="index.html" class="brand">ClinicBook.</a>
            <a href="index.html" class="btn btn-soft">Logout</a>
        </div>
    </nav>

    <main class="container-main">

        <section class="welcome">
            <h1>Doctor Dashboard</h1>
            <p class="mb-0">Welcome back, Doctor!</p>
            <p class="mt-2 mb-0" id="todayDate"></p>
        </section>

        <h2 class="section-title">Overview</h2>

        <div class="row g-4">

            <div class="col-md-4">
                <div class="stat-card lilac">
                    <p class="text-secondary">Total Appointments</p>
                    <h2 id="totalAppointments">0</h2>
                </div>
            </div>

            <div class="col-md-4">
                <div class="stat-card lilac">
                    <p class="text-secondary">Booked Appointments</p>
                    <h2 id="bookedAppointments">0</h2>
                </div>
            </div>

            <div class="col-md-4">
                <div class="stat-card lilac">
                    <p class="text-secondary">Completed Appointments</p>
                    <h2 id="completedAppointments">0</h2>
                </div>
            </div>

        </div>

        <h2 class="section-title">Patient Appointments</h2>

        <div class="stat-card lilac">
            <div class="table-responsive">

                <table class="table table-hover">

                    <thead>
                        <tr>
                            <th>Patient</th>
                            <th>Phone</th>
                            <th>Doctor</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="doctorAppointments"></tbody>

                </table>

            </div>
        </div>

    </main>

    <footer>© 2026 ClinicBook.</footer>

    <script src="script.js"></script>

</body>
</html>
