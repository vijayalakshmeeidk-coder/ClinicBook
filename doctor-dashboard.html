<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard - ClinicBook</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="brand">ClinicBook</div>
        <nav>
            <a href="index.html">Patient</a>
            <a href="doctor-dashboard.html" class="active">Doctor</a>
            <a href="receptionist-dashboard.html">Receptionist</a>
        </nav>
    </header>

    <main class="container">

        <!-- DOCTOR LOGIN -->
        <section class="login-card" id="doctorLoginSection">
            <h1>Doctor Login</h1>
            <p class="muted-copy">Please select your doctor account to continue.</p>

            <form onsubmit="saveDoctorLogin(event)" class="form-grid">

                <div class="form-group">
                    <label for="doctorLoginSelect">Who are you?</label>
                    <select id="doctorLoginSelect" required>
                        <option value="">Choose a doctor</option>
                    </select>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn-primary-soft">
                        Login to Dashboard
                    </button>
                </div>

            </form>
        </section>

        <!-- DOCTOR DASHBOARD -->
        <div id="doctorDashboardContent" hidden>

            <section class="profile-card">
                <h1>Welcome, <span id="doctorProfileName"></span></h1>

                <p class="subtext">
                    <span id="doctorProfileSpecialty"></span> |
                    <span id="doctorProfileHospital"></span>
                </p>

                <button class="btn-quiet" onclick="logoutDoctor()">
                    Logout
                </button>
            </section>

            <section class="stats-grid">

                <div class="stat-card">
                    <h3>Total Appointments</h3>
                    <p id="totalAppointments">0</p>
                </div>

                <div class="stat-card">
                    <h3>Booked</h3>
                    <p id="bookedAppointments">0</p>
                </div>

                <div class="stat-card">
                    <h3>Completed</h3>
                    <p id="completedAppointments">0</p>
                </div>

            </section>

            <section class="table-card">
                <h2>My Appointments</h2>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Patient</th>
                                <th>Phone</th>
                                <th>Email</th>
                                <th>Doctor</th>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody id="doctorAppointments"></tbody>
                    </table>
                </div>
            </section>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
