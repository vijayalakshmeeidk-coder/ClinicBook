<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doctor Dashboard - ClinicBook</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="navbar">
    <div class="logo">ClinicBook</div>
    <nav>
      <a href="index.html">Patient</a>
      <a href="doctor.html" class="active">Doctor</a>
      <a href="receptionist.html">Receptionist</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <h1>Doctor Dashboard</h1>
      <p id="doctorProfile" class="subtext">Loading doctor profile...</p>

      <!-- Added Doctor Login Form -->
      <form onsubmit="saveDoctorLogin(event)" class="form-grid" style="margin-top: 16px;">
        <div class="form-group">
          <label for="doctorLoginSelect">Switch Doctor Account</label>
          <select id="doctorLoginSelect" required></select>
        </div>
        <div class="form-group" style="display: flex; align-items: flex-end;">
          <button type="submit" class="btn">Log In</button>
        </div>
      </form>
    </section>

    <section class="summary-grid">
      <div class="summary-card">
        <h3>Total Appointments</h3>
        <p id="docTotal">0</p>
      </div>
      <div class="summary-card">
        <h3>Booked</h3>
        <p id="docBooked">0</p>
      </div>
      <div class="summary-card">
        <h3>Completed</h3>
        <p id="docCompleted">0</p>
      </div>
    </section>

    <section class="card">
      <h2>Assigned Appointments</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Patient</th>
              <th>Age / Gender</th>
              <th>Phone</th>
              <th>Date</th>
              <th>Time</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="doctorAppointments"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
