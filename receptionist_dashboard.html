<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Receptionist Dashboard | ClinicBook</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar shadow-sm">
        <div class="container">
            <a href="index.html" class="brand">ClinicBook.</a>
            <a href="index.html" class="btn btn-soft">Logout</a>
        </div>
    </nav>

    <main class="container-main">

        <section class="welcome">
            <h1>Receptionist Dashboard</h1>
            <p class="mb-0">
                Manage clinic appointments and patient visits.
            </p>
        </section>

        <h2 class="section-title">Overview</h2>

        <div class="row g-4">

            <div class="col-md-6">
                <div class="card-custom">
                    <p class="text-secondary">Total Appointments</p>
                    <h2 id="receptionistTotal">0</h2>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card-custom">
                    <p class="text-secondary">Booked Appointments</p>
                    <h2 id="receptionistBooked">0</h2>
                </div>
            </div>

        </div>

        <h2 class="section-title">All Appointments</h2>

        <div class="card-custom">
            <div class="table-responsive">

                <table class="table table-hover">

                    <thead>
                        <tr>
                            <th>Patient</th>
                            <th>Phone</th>
                            <th>Doctor</th>
                            <th>Hospital</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="receptionistAppointments"></tbody>

                </table>

            </div>
        </div>

    </main>

    <footer>© 2026 ClinicBook.</footer>

    <script src="script.js"></script>

</body>
</html>
